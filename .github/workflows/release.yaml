name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: intervals-linux-amd64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: intervals-linux-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: intervals-macos-amd64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: intervals-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: intervals-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup update stable
      - uses: taiki-e/setup-cross-toolchain-action@74847e552ab5bf79fa4393ed975e297ea57d53fa # v1.40.0
        with:
          target: ${{ matrix.target }}
      - name: Build
        run: cargo build --release
      - name: Package binary
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release intervals
      - name: Package binary
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/intervals.exe -DestinationPath ${{ matrix.archive }}
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --generate-notes \
            artifacts/intervals-linux-amd64.tar.gz \
            artifacts/intervals-linux-arm64.tar.gz \
            artifacts/intervals-macos-amd64.tar.gz \
            artifacts/intervals-macos-arm64.tar.gz \
            artifacts/intervals-windows-amd64.zip
