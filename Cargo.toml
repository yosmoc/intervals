[package]
name = "intervals-cli"
version = "0.0.10"
edition = "2024"
description = "CLI for the Intervals.icu API"
license = "MIT"
repository = "https://github.com/yosmoc/intervals"

[[bin]]
name = "intervals"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
urlencoding = "2"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
